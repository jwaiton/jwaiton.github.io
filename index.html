<!DOCTYPE html>
<html>
    <head>
        <style>
            /* top bar with logo and links */
            .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 20px;
                background-color: #333;
                color: white;
            }

            /* profile picture component */
            .top-bar img {
                height: 40px;
            }

            /* links */
            .nav-links a {
                color: white;
                text-decoration: none;
                margin-left: 20px;
                font-size: 16px;
            }
            
            /* add underline */
            .nav-links a:hover {
                text-decoration: underline;
            }
        </style>
    </head>


    <body>

        <div class="top bar">
            <img src="https://avatars.githubusercontent.com/u/22132593?v=4" alt="ProfilePicture">

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="pages/contact.html">Contact</a>
            </div>
        </div>

    </body>
</html>
